<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinevo Beta</title>
  <link rel="stylesheet" href="/cinevo.css">
  <script src="/cinevo.js" defer></script>
</head>
<body>
  <header>
    <button class="brand" data-section="library" aria-label="Cinevo, início">cinevo<span></span></button>
    <nav aria-label="Coleção">
      <button data-section="library" aria-current="page">Minha biblioteca</button>
      <button data-section="imports">Filmes importados <span id="imports-count" hidden></span></button>
      <button data-section="favorites">Favoritos</button>
    </nav>
    <div class="tools">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar na coleção" aria-label="Buscar na coleção"></label>
      <details class="menu"><summary aria-label="Opções do Cinevo">···</summary>
        <div>
          <button data-command="add-folder">Adicionar pasta</button>
          <button data-command="folders">Gerenciar pastas</button>
          <button id="scan" data-command="scan">Atualizar arquivos</button>
          <button data-command="covers">Buscar ou pausar capas</button>
          <button data-command="portal">Portal online</button>
          <button data-command="settings">Configurações</button>
          <button data-command="classic">Interface clássica</button>
          <button data-command="quit">Sair do Cinevo</button>
        </div>
      </details>
    </div>
  </header>
  <main id="main" aria-busy="true">
    <section id="hero" class="hero" hidden></section>
    <div id="collection">
      <div id="page-head" hidden></div>
      <div id="rows"></div>
      <button id="more" class="button secondary" hidden>Carregar mais filmes</button>
    </div>
  </main>
  <footer>
    <span id="version">Cinevo Beta</span>
    <span id="status" role="status"></span>
    <button id="update" class="button secondary" data-command="update" hidden>Instalar atualização</button>
  </footer>
  <dialog id="details" aria-labelledby="detail-title">
    <button class="dialog-close" aria-label="Fechar detalhes">×</button>
    <div id="detail-content"></div>
  </dialog>
  <dialog id="import-dialog" aria-labelledby="import-title">
    <button id="close-import" class="dialog-close" aria-label="Fechar importação">×</button>
    <h2 id="import-title">Importar endereço</h2>
    <p class="description">Cole o endereço HTTPS de um filme ou catálogo.</p>
    <form id="import-form">
      <input id="import-url" type="url" maxlength="4000" aria-label="Endereço do filme ou catálogo" placeholder="https://…" required autofocus>
      <div class="actions">
        <button id="start-import" type="submit" class="button accent">Importar</button>
        <button id="pause-import" type="button" class="button secondary" hidden>Pausar</button>
        <button id="resume-import" type="button" class="button secondary" hidden>Continuar importação</button>
      </div>
    </form>
    <p id="import-status" class="meta" role="status"></p>
  </dialog>
</body>
</html>
