name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão beta, por exemplo 0.1.1-beta.2'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify installer
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(-beta\.\d+)?$') { throw 'Invalid version' }
          ./scripts/build.ps1 -Version $version
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $displayVersion = ($env:RELEASE_VERSION -split '-')[0]
          gh release create "v$env:RELEASE_VERSION" dist/Cinevo-Setup.exe dist/SHA256SUMS.txt dist/vlc-3.0.24-source.tar.xz --title "Cinevo $displayVersion Beta" --prerelease --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Publicação falhou' }
